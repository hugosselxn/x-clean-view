<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Clean View settings</title>
  <style>
    body { width: 300px; margin: 0; padding: 18px; color: #e7e9ea; background: #000; font: 14px system-ui, sans-serif; }
    h1 { margin: 0 0 4px; font-size: 18px; }
    p { margin: 0 0 16px; color: #71767b; line-height: 1.4; }
    h2 { margin: 18px 0 8px; font-size: 12px; color: #71767b; text-transform: uppercase; letter-spacing: .07em; }
    label { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; cursor: pointer; }
    input { accent-color: #1d9bf0; width: 18px; height: 18px; cursor: pointer; }
    .section { border-top: 1px solid #2f3336; }
    .layout-note { margin: 8px 0 14px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>X Clean View</h1>
  <p>Choose what appears on X. Changes apply to open tabs immediately.</p>
  <div id="settings"></div>
  <script src="popup.js"></script>
</body>
</html>
